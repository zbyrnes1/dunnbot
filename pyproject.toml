[project]
name = "dunnbot"
version = "0.1.0"
description = "Discord bot that roasts the Penguins' defense whenever they trail by 2."
requires-python = ">=3.12"
# Standalone on purpose: none of this is an evscan dependency.
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
]

[project.scripts]
dunnbot = "dunnbot.bot:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dunnbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
